name: Deploy Aarogya AI Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.login-ecr.outputs.registry }}/aarogya-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name aarogya-api \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/aarogya-backend:latest \
            --region us-east-1

      - name: Wait for Lambda Code Update
        run: |
          aws lambda wait function-updated \
            --function-name aarogya-api \
            --region us-east-1

      - name: Verify Lambda Active
        run: |
          aws lambda wait function-active \
            --function-name aarogya-api \
            --region us-east-1
